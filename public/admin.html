<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול Dare2Know</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; text-align: right; line-height: 1.5; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; flex: 1; min-width: 200px; text-align: center; border: 1px solid #334155; }
        .card h2 { color: #fbbf24; margin: 0; font-size: 36px; }
        .card div { color: #94a3b8; font-weight: bold; margin-top: 5px; }
        .section { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; }
        h3 { color: #fbbf24; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: right; font-size: 14px; }
        th { color: #94a3b8; background: rgba(255,255,255,0.05); }
        .badge { background: #10b981; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>לוח בקרה למנהל 🧠</h1>
    
    <div class="stats">
        <div class="card"><h2 id="s1">-</h2><div>משפחות רשומות</div></div>
        <div class="card"><h2 id="s2">-</h2><div>מנויים משלמים</div></div>
        <div class="card"><h2 id="s3">-</h2><div>חידונים שנוצרו</div></div>
    </div>

    <div class="section">
        <h3>💳 מנויים פעילים (לקוחות משלמים)</h3>
        <table id="subsTable">
            <tr><th>משפחה</th><th>תוכנית</th><th>תאריך</th></tr>
        </table>
    </div>

    <div class="section">
        <h3>🎮 חידונים אחרונים (קבוצות משחקות)</h3>
        <table id="challengesTable">
            <tr><th>נושא</th><th>יוצר</th><th>קוד</th><th>שעה</th></tr>
        </table>
    </div>

    <div class="section">
        <h3>👥 משפחות חדשות</h3>
        <table id="famTable">
            <tr><th>שם המשפחה</th><th>תאריך הצטרפות</th></tr>
        </table>
    </div>

    <script>
        var key = new URLSearchParams(window.location.search).get("key");
        if (!key) { alert("חסר מפתח ב-URL"); }
        else {
            fetch("/api/admin?key=" + key)
                .then(function(res) { return res.json(); })
                .then(function(d) {
                    if (d.error) throw new Error(d.error);
                    
                    // עדכון המונים
                    document.getElementById("s1").innerText = d.totalFamilies;
                    document.getElementById("s2").innerText = d.activeSubscriptions;
                    document.getElementById("s3").innerText = d.activeGroups;
                    
                    // מנויים
                    var sTab = document.getElementById("subsTable");
                    if (d.recentSubs.length === 0) sTab.innerHTML += "<tr><td colspan='3'>אין מנויים פעילים כרגע</td></tr>";
                    d.recentSubs.forEach(function(s) {
                        sTab.innerHTML += "<tr><td>" + s.family_name + "</td><td><span class='badge'>" + s.plan + "</span></td><td>" + new Date(s.created_at).toLocaleDateString("he-IL") + "</td></tr>";
                    });

                    // חידונים
                    var cTab = document.getElementById("challengesTable");
                    d.recentChallenges.forEach(function(c) {
                        var time = new Date(c.created_at).toLocaleTimeString("he-IL", {hour: '2-digit', minute:'2-digit'});
                        cTab.innerHTML += "<tr><td>" + (c.topic || "כללי") + "</td><td>" + c.creator_family + "</td><td><code>" + c.code + "</code></td><td>" + time + "</td></tr>";
                    });

                    // משפחות
                    var fTab = document.getElementById("famTable");
                    d.recentFamilies.forEach(function(f) {
                        fTab.innerHTML += "<tr><td>" + f.name + "</td><td>" + new Date(f.created_at).toLocaleDateString("he-IL") + "</td></tr>";
                    });
                })
                .catch(function(err) { alert("שגיאה: " + err.message); });
        }
    </script>
</body>
</html>
